<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a2fb0"/>
      <stop offset="100%" stop-color="#0d1a7a"/>
    </linearGradient>
    <linearGradient id="glass1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7cc6ff"/>
      <stop offset="55%" stop-color="#3d8eff"/>
      <stop offset="100%" stop-color="#2f6fe0"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd0ff"/>
      <stop offset="55%" stop-color="#4a97ff"/>
      <stop offset="100%" stop-color="#3577e6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Outer D shape (white) -->
  <path d="M 150 95
           L 150 417
           L 258 417
           C 340 417 400 355 400 256
           C 400 157 340 95 258 95
           Z"
        fill="#ffffff"/>

  <!-- Inner cut of the D (background color) to make it a ring -->
  <path d="M 195 140
           L 195 372
           L 255 372
           C 315 372 355 322 355 256
           C 355 190 315 140 255 140
           Z"
        fill="url(#bg)"/>

  <!-- Left window pane (narrow, white frame, angled left edge like an open casement) -->
  <path d="M 150 95 L 195 140 L 195 372 L 150 417 Z" fill="#ffffff" fill-opacity="0"/>
  <path d="M 150 95 L 195 140 L 195 372 L 150 417 Z" fill="none" stroke="#ffffff" stroke-width="0"/>

  <!-- Window frame lines / mullions on the left slanted panel -->
  <g fill="none" stroke="#ffffff" stroke-width="14">
    <path d="M 150 95 L 195 140"/>
    <path d="M 150 417 L 195 372"/>
  </g>

  <!-- Glass panes (two panels) sitting inside the D, angled like open windows -->
  <path d="M 213 178 L 253 200 L 253 322 L 213 344 Z" fill="url(#glass1)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
  <path d="M 265 205 L 305 230 L 305 296 L 265 321 Z" fill="url(#glass2)" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>

  <!-- Glass shine streaks -->
  <path d="M 220 260 L 240 240 L 240 250 L 220 270 Z" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M 220 290 L 248 262 L 248 274 L 220 302 Z" fill="#ffffff" fill-opacity="0.25"/>
  <path d="M 272 270 L 292 250 L 292 260 L 272 280 Z" fill="#ffffff" fill-opacity="0.3"/>

  <!-- Left frame vertical strip (mimics the folded/open door leaf on far left) -->
  <path d="M 150 95 L 150 417 L 178 400 L 178 112 Z" fill="#ffffff"/>
</svg>