<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Desglose Pro</title>
  <link rel="icon" type="image/svg+xml" href="favicon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: #64748b;
      stroke: #64748b;
    }
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 2rem;
    }
    .logo-box {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #0d1e3d;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .logo-name {
      font-size: 15px;
      font-weight: 700;
      color: #0d1e3d;
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .tips {
      background: #f8fafc;
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
    }
    .tips-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 0.5rem;
    }
    .tip {
      font-size: 13px;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .tip::before { content: '•'; color: #0d1e3d; font-weight: 700; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 12px;
      background: #0d1e3d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<script>
  function retryConnection() {
    if (navigator.onLine) {
      window.location.href = '/dashboard'
    } else {
      alert('No tienes conexión a Internet.')
    }
  }

  window.addEventListener('online', () => {
    window.location.href = '/dashboard'
  })
</script>
<body>
  <div class="card">
    <div class="logo">
      <h1 class="class="btn">Desglose Pro</h1>
    </div>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.56 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
      </svg>
    </div>

    <h1>Sin conexión a internet</h1>
    <p>No se puede conectar en este momento. Verifica tu conexión e intenta de nuevo.</p>

    <div class="tips">
      <div class="tips-title">Mientras tanto puedes</div>
      <div class="tip">Revisar tus cálculos guardados</div>
      <div class="tip">Verificar tu conexión WiFi o datos</div>
      <div class="tip">Volver a intentarlo en unos segundos</div>
    </div>

    <button class="btn" onclick="retryConnection()">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M23 4v6h-6M1 20v-6h6"/>
    <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
  </svg>
  Reintentar
</button>
  </div>
</body>
</html>
